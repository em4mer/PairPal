<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1e1b14" rx="10"/>

  <!-- Glass body -->
  <rect x="62" y="55" width="76" height="110" rx="6" fill="rgba(180,200,220,.12)" stroke="#c9963a" stroke-width="1.5"/>
  <!-- Coffee inside -->
  <rect x="65" y="100" width="70" height="62" rx="4" fill="#2c1a0a" opacity=".8"/>
  <!-- Plunger rod -->
  <rect x="97" y="20" width="6" height="100" rx="3" fill="#3a3a3a" stroke="#c9963a" stroke-width=".8"/>
  <!-- Plunger disk -->
  <rect x="66" y="116" width="68" height="6" rx="3" fill="#3a3030" stroke="#c9963a" stroke-width="1"/>
  <!-- Knob on top -->
  <circle cx="100" cy="20" r="10" fill="#3a3a3a" stroke="#c9963a" stroke-width="1.2"/>
  <circle cx="100" cy="20" r="5" fill="#c9963a" opacity=".5"/>
  <!-- Frame/collar -->
  <rect x="58" y="48" width="84" height="14" rx="5" fill="#3a3a3a" stroke="#c9963a" stroke-width="1.2"/>
  <!-- Spout -->
  <path d="M138 75 Q155 72 155 80 Q155 88 138 88" fill="none" stroke="#c9963a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Base -->
  <rect x="56" y="158" width="88" height="12" rx="5" fill="#3a3a3a" stroke="#c9963a" stroke-width="1"/>
  <!-- Reflection on glass -->
  <rect x="68" y="60" width="8" height="80" rx="4" fill="rgba(255,255,255,.06)"/>

</svg>
