<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1e1b14" rx="10"/>

  <!-- Sleek black bag -->
  <rect x="50" y="42" width="100" height="130" rx="8" fill="#1a1a1a" stroke="#c9963a" stroke-width="1.8"/>
  <!-- Gold accent stripe -->
  <rect x="50" y="78" width="100" height="3" fill="#c9963a" opacity=".6"/>
  <rect x="50" y="138" width="100" height="3" fill="#c9963a" opacity=".6"/>
  <!-- Degassing valve -->
  <circle cx="80" cy="60" r="8" fill="#2a2a2a" stroke="#c9963a" stroke-width="1"/>
  <circle cx="80" cy="60" r="4" fill="#c9963a" opacity=".4"/>
  <!-- Espresso swirl logo -->
  <path d="M100 95 Q118 88 118 105 Q118 122 100 118 Q82 114 82 100 Q82 86 100 95 Z" fill="none" stroke="#c9963a" stroke-width="1.5" opacity=".7"/>
  <circle cx="100" cy="105" r="6" fill="#c9963a" opacity=".5"/>
  <!-- Label text lines -->
  <rect x="58" y="148" width="84" height="4" rx="2" fill="#c9963a" opacity=".25"/>
  <rect x="64" y="158" width="72" height="3" rx="1.5" fill="#c9963a" opacity=".2"/>
  <rect x="68" y="166" width="64" height="3" rx="1.5" fill="#c9963a" opacity=".15"/>
  <!-- Tear notch -->
  <path d="M148 42 L148 56" stroke="#c9963a" stroke-width=".8" stroke-dasharray="2,2" opacity=".5"/>

</svg>
