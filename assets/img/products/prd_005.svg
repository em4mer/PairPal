<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1e1b14" rx="10"/>

  <!-- Stand legs -->
  <line x1="70" y1="165" x2="85" y2="110" stroke="#c9963a" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <line x1="130" y1="165" x2="115" y2="110" stroke="#c9963a" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <line x1="100" y1="168" x2="100" y2="110" stroke="#c9963a" stroke-width="2" stroke-linecap="round" opacity=".7"/>
  <!-- Base ring -->
  <ellipse cx="100" cy="165" rx="35" ry="6" fill="none" stroke="#c9963a" stroke-width="1.5" opacity=".6"/>
  <!-- Dripper cone -->
  <path d="M68 75 L132 75 L112 140 L88 140 Z" fill="#3d2e1a" stroke="#c9963a" stroke-width="1.5"/>
  <!-- Ribs inside cone -->
  <line x1="82" y1="82" x2="90" y2="132" stroke="#c9963a" stroke-width=".8" opacity=".4"/>
  <line x1="100" y1="80" x2="100" y2="135" stroke="#c9963a" stroke-width=".8" opacity=".4"/>
  <line x1="118" y1="82" x2="110" y2="132" stroke="#c9963a" stroke-width=".8" opacity=".4"/>
  <!-- Filter paper -->
  <path d="M72 76 L128 76 L110 132 L90 132 Z" fill="rgba(255,245,230,.08)"/>
  <!-- Top rim -->
  <rect x="64" y="68" width="72" height="12" rx="5" fill="#4a3820" stroke="#c9963a" stroke-width="1.2"/>
  <!-- Drip drop -->
  <path d="M100 145 Q104 152 100 158 Q96 152 100 145 Z" fill="#c9963a" opacity=".6"/>
  <!-- Mug below -->
  <rect x="80" y="158" width="40" height="28" rx="5" fill="#2a2a2a" stroke="#c9963a" stroke-width=".8" opacity=".5"/>

</svg>
