<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1e1b14" rx="10"/>

  <!-- Tumbler body -->
  <path d="M65 40 L135 40 L128 168 L72 168 Z" fill="#2a2a2a" stroke="#c9963a" stroke-width="1.5"/>
  <!-- Shine -->
  <path d="M74 44 L84 44 L80 164 L72 164 Z" fill="#3a3a3a" opacity=".5"/>
  <!-- Lid -->
  <rect x="62" y="30" width="76" height="18" rx="7" fill="#3d3018" stroke="#c9963a" stroke-width="1.5"/>
  <rect x="74" y="34" width="52" height="5" rx="2.5" fill="#c9963a" opacity=".35"/>
  <!-- Straw hole -->
  <ellipse cx="100" cy="30" rx="6" ry="4" fill="#1e1b14" stroke="#c9963a" stroke-width="1"/>
  <!-- Straw -->
  <rect x="97" y="4" width="6" height="30" rx="3" fill="#c9963a" opacity=".85"/>
  <!-- Band -->
  <rect x="65" y="100" width="70" height="34" rx="0" fill="#c9963a" opacity=".08"/>
  <line x1="65" y1="100" x2="135" y2="100" stroke="#c9963a" stroke-width=".75" opacity=".35"/>
  <line x1="66" y1="134" x2="134" y2="134" stroke="#c9963a" stroke-width=".75" opacity=".35"/>
  <!-- Logo diamond -->
  <path d="M100 110 L108 117 L100 124 L92 117 Z" fill="none" stroke="#c9963a" stroke-width="1.2" opacity=".5"/>
  <!-- Bottom -->
  <ellipse cx="100" cy="168" rx="28" ry="5" fill="#3d3018" opacity=".6"/>

</svg>
