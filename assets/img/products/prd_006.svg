<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1e1b14" rx="10"/>

  <!-- Wrapper -->
  <rect x="40" y="60" width="120" height="80" rx="6" fill="#3a1a0a" stroke="#c9963a" stroke-width="1.2"/>
  <!-- Gold foil edge -->
  <rect x="44" y="64" width="112" height="72" rx="4" fill="none" stroke="#c9963a" stroke-width=".6" opacity=".4"/>
  <!-- Chocolate bar grid - 4x3 -->
  <rect x="50" y="72" width="22" height="18" rx="2" fill="#2a1005"/>
  <rect x="75" y="72" width="22" height="18" rx="2" fill="#2a1005"/>
  <rect x="100" y="72" width="22" height="18" rx="2" fill="#2a1005"/>
  <rect x="125" y="72" width="18" height="18" rx="2" fill="#2a1005"/>
  <rect x="50" y="93" width="22" height="18" rx="2" fill="#2a1005"/>
  <rect x="75" y="93" width="22" height="18" rx="2" fill="#2a1005"/>
  <rect x="100" y="93" width="22" height="18" rx="2" fill="#2a1005"/>
  <rect x="125" y="93" width="18" height="18" rx="2" fill="#2a1005"/>
  <rect x="50" y="114" width="22" height="16" rx="2" fill="#2a1005"/>
  <rect x="75" y="114" width="22" height="16" rx="2" fill="#2a1005"/>
  <rect x="100" y="114" width="22" height="16" rx="2" fill="#2a1005"/>
  <rect x="125" y="114" width="18" height="16" rx="2" fill="#2a1005"/>
  <!-- Label strip -->
  <rect x="52" y="152" width="96" height="22" rx="4" fill="#2a2416" stroke="#c9963a" stroke-width=".75"/>
  <line x1="60" y1="160" x2="140" y2="160" stroke="#c9963a" stroke-width=".7" opacity=".4"/>
  <line x1="64" y1="166" x2="136" y2="166" stroke="#c9963a" stroke-width=".7" opacity=".3"/>

</svg>
