<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1e1b14" rx="10"/>

  <!-- Kraft bag -->
  <path d="M55 70 L145 70 L138 168 L62 168 Z" fill="#8B6914" stroke="#c9963a" stroke-width="1.5"/>
  <!-- Bag top seal -->
  <rect x="52" y="58" width="96" height="18" rx="4" fill="#7a5c10" stroke="#c9963a" stroke-width="1.2"/>
  <!-- Fold lines on top -->
  <line x1="58" y1="65" x2="142" y2="65" stroke="#c9963a" stroke-width=".6" opacity=".4"/>
  <!-- Label -->
  <rect x="65" y="88" width="70" height="50" rx="5" fill="rgba(255,245,210,.12)" stroke="#c9963a" stroke-width=".8"/>
  <!-- Coconut icon -->
  <circle cx="100" cy="105" r="14" fill="#5a3c0a" stroke="#c9963a" stroke-width=".8"/>
  <path d="M88 100 Q100 92 112 100" fill="none" stroke="#c9963a" stroke-width="1" opacity=".5"/>
  <circle cx="100" cy="105" r="6" fill="#3a2206"/>
  <!-- Sugar crystals scattered -->
  <rect x="68" y="148" width="5" height="5" rx="1" fill="#c9963a" opacity=".4" transform="rotate(15,70,150)"/>
  <rect x="82" y="152" width="4" height="4" rx="1" fill="#c9963a" opacity=".3" transform="rotate(-10,84,154)"/>
  <rect x="110" y="148" width="5" height="5" rx="1" fill="#c9963a" opacity=".4" transform="rotate(25,112,150)"/>
  <rect x="122" y="152" width="4" height="4" rx="1" fill="#c9963a" opacity=".3"/>

</svg>
