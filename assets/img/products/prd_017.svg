<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#1e1b14" rx="10"/>

  <!-- Box -->
  <rect x="42" y="52" width="116" height="108" rx="8" fill="#2a280e" stroke="#c9963a" stroke-width="1.5"/>
  <!-- Box lid -->
  <rect x="42" y="52" width="116" height="28" rx="8" fill="#38340e"/>
  <rect x="42" y="68" width="116" height="12" fill="#38340e"/>
  <!-- Chamomile flower on lid -->
  <circle cx="100" cy="65" r="8" fill="#FFD700" opacity=".7"/>
  <!-- Petals -->
  <ellipse cx="100" cy="52" rx="4" ry="6" fill="#FFD700" opacity=".5"/>
  <ellipse cx="100" cy="78" rx="4" ry="6" fill="#FFD700" opacity=".5"/>
  <ellipse cx="87" cy="65" rx="6" ry="4" fill="#FFD700" opacity=".5"/>
  <ellipse cx="113" cy="65" rx="6" ry="4" fill="#FFD700" opacity=".5"/>
  <ellipse cx="91" cy="56" rx="4" ry="6" fill="#FFD700" opacity=".4" transform="rotate(-45,91,56)"/>
  <ellipse cx="109" cy="56" rx="4" ry="6" fill="#FFD700" opacity=".4" transform="rotate(45,109,56)"/>
  <ellipse cx="91" cy="74" rx="4" ry="6" fill="#FFD700" opacity=".4" transform="rotate(45,91,74)"/>
  <ellipse cx="109" cy="74" rx="4" ry="6" fill="#FFD700" opacity=".4" transform="rotate(-45,109,74)"/>
  <!-- Label area -->
  <rect x="50" y="88" width="100" height="64" rx="4" fill="rgba(255,215,0,.06)"/>
  <line x1="56" y1="102" x2="144" y2="102" stroke="#c9963a" stroke-width=".75" opacity=".35"/>
  <line x1="56" y1="116" x2="144" y2="116" stroke="#c9963a" stroke-width=".75" opacity=".3"/>
  <line x1="60" y1="130" x2="140" y2="130" stroke="#c9963a" stroke-width=".75" opacity=".25"/>
  <line x1="60" y1="142" x2="140" y2="142" stroke="#c9963a" stroke-width=".75" opacity=".25"/>
  <!-- Tea bag peek -->
  <rect x="88" y="152" width="24" height="18" rx="3" fill="#38340e" stroke="#c9963a" stroke-width=".7"/>
  <line x1="100" y1="152" x2="100" y2="145" stroke="#c9963a" stroke-width=".8"/>
  <rect x="97" y="140" width="6" height="8" rx="1" fill="#c9963a" opacity=".5"/>

</svg>
