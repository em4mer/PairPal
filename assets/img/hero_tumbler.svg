<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" fill="#1e1b14" rx="12"/>
  <!-- Tumbler body -->
  <path d="M55 38 L105 38 L100 140 L60 140 Z" fill="#2a2a2a" stroke="#c9963a" stroke-width="1.5"/>
  <!-- Tumbler shine/highlight -->
  <path d="M63 42 L73 42 L70 136 L62 136 Z" fill="#3a3a3a" opacity="0.6"/>
  <!-- Lid -->
  <rect x="52" y="30" width="56" height="14" rx="6" fill="#3d3018" stroke="#c9963a" stroke-width="1.5"/>
  <!-- Lid rim detail -->
  <rect x="60" y="34" width="40" height="4" rx="2" fill="#c9963a" opacity="0.4"/>
  <!-- Straw hole -->
  <ellipse cx="80" cy="30" rx="5" ry="3" fill="#1e1b14" stroke="#c9963a" stroke-width="1"/>
  <!-- Straw -->
  <rect x="77" y="4" width="6" height="30" rx="3" fill="#c9963a" opacity="0.8"/>
  <!-- Label band -->
  <rect x="55" y="80" width="50" height="30" rx="0" fill="#c9963a" opacity="0.12"/>
  <path d="M55 80 L105 80" stroke="#c9963a" stroke-width="0.75" opacity="0.4"/>
  <path d="M55 110 L105 110" stroke="#c9963a" stroke-width="0.75" opacity="0.4"/>
  <!-- Decorative diamond on label -->
  <path d="M80 88 L86 95 L80 102 L74 95 Z" fill="none" stroke="#c9963a" stroke-width="1" opacity="0.6"/>
  <!-- Bottom reflection -->
  <ellipse cx="80" cy="140" rx="20" ry="4" fill="#c9963a" opacity="0.15"/>
</svg>
